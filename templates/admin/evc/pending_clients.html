{% extends "admin/base.html" %}

{% block content %}


<div class="d-flex justify-content-between mb-3">

    <h5>
        Pending EVC Clients
    </h5>

</div>


<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Client</th>

<th>PAN</th>

<th>Assign User</th>

</tr>

</thead>


<tbody>


{% for c in clients %}


<tr>


<!-- client_name -->
<td>

{{ c[1] }}

</td>



<!-- pan_no -->
<td>

{{ c[2] }}

</td>



<td>


<form
method="POST"
action="/admin/assign-client/{{ c[0] }}">



<select
name="user_id"
class="form-select"
required>


<option value="">
Select User
</option>



{% for u in users %}


<option value="{{ u[0] }}">

{{ u[1] }}

</option>


{% endfor %}


</select>


<button
class="btn btn-success btn-sm mt-2">

Assign

</button>



</form>


</td>


</tr>


{% else %}


<tr>

<td colspan="3"
class="text-center text-muted">

No Pending Clients Available

</td>

</tr>


{% endfor %}


</tbody>


</table>


{% endblock %}

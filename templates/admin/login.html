<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Login | Adv. Thakre & Associates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --dark-charcoal: #1a1c1e;
            --soft-white: #f8f9fa;
        }

        body {
            /* Sophisticated dark gradient */
            background: radial-gradient(circle at top right, #2c2e30, #111111);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-top: 4px solid var(--gold); /* Legal authority accent */
            transition: transform 0.3s ease;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        /* Form Styling */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border: 1px solid #e0e0e0;
            background-color: #fcfcfc;
            font-size: 1rem;
            padding: 12px 15px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.1);
        }

        .btn-login {
            background-color: var(--dark-charcoal);
            color: white;
            font-weight: 600;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #000;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: var(--gold);
        }

        .forgot-link {
            color: #6c757d;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--gold);
        }

        /* Responsive Tweaks */
        @media(max-width: 576px) {
            .container {
                padding: 20px;
            }
            .brand-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">

        <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-11">

            <!-- Branding above card for better mobile spacing -->
            <div class="text-center mb-4">
                <div class="brand-title">Adv. Thakre & Associates</div>
                <div class="text-light opacity-50 small text-uppercase mt-1" style="letter-spacing: 2px;">Secure Admin Portal</div>
            </div>

            <div class="card login-card p-4 p-md-5 bg-white">

                <!-- Flash Message -->
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="alert alert-danger border-0 small text-center mb-4">
                        <i class="bi bi-exclamation-circle me-2"></i> {{ messages[0] }}
                    </div>
                  {% endif %}
                {% endwith %}

                <form method="POST">

                    <div class="mb-4">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <input type="email" name="username" class="form-control" placeholder="Enter email" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label">Password</label>
                        </div>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button class="btn btn-login w-100 py-2 shadow-sm mt-2">
                        Sign In <i class="bi bi-shield-lock ms-2"></i>
                    </button>

                </form>

                <div class="text-center mt-4">
                    <a href="/forgot-password" class="forgot-link text-decoration-none">
                        <i class="bi bi-question-circle me-1"></i> Forgot Password?
                    </a>
                </div>

            </div>

            <p class="text-center text-muted mt-5 mb-0" style="font-size: 0.75rem;">
                &copy; 2026 Adv. Thakre & Associates. <br>
                Authorized Personnel Only.
            </p>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

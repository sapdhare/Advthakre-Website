<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Recovery | Adv. Thakre & Associates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --dark-charcoal: #1a1c1e;
        }

        body {
            /* Consistent sophisticated dark gradient */
            background: radial-gradient(circle at top right, #2c2e30, #111111);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .recovery-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-top: 4px solid var(--gold);
            background: white;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border: 1px solid #e0e0e0;
            background-color: #fcfcfc;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.1);
        }

        .btn-recovery {
            background-color: var(--dark-charcoal);
            color: white;
            font-weight: 600;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-recovery:hover {
            background-color: #000;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: var(--gold);
        }

        .back-link {
            color: #6c757d;
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        @media(max-width: 576px) {
            .container { padding: 20px; }
            .brand-title { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">

        <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-11">

            <div class="text-center mb-4">
                <div class="brand-title">Adv. Thakre & Associates</div>
                <div class="text-light opacity-50 small text-uppercase mt-1" style="letter-spacing: 2px;">Identity Verification</div>
            </div>

            <div class="card recovery-card p-4 p-md-5">

                <div class="mb-4 text-center">
                    <h5 class="fw-bold mb-1">Forgot Password?</h5>
                    <p class="text-muted small">Enter your email to receive a verification OTP.</p>
                </div>

                <!-- Flash Messages -->
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="alert alert-info border-0 small text-center mb-4 py-2">
                        <i class="bi bi-info-circle me-2"></i> {{ messages[0] }}
                    </div>
                  {% endif %}
                {% endwith %}

                <form method="POST" action="/forgot-password">
                    <div class="mb-4">
                        <label class="form-label">Registered Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" name="email" class="form-control border-start-0 shadow-none"
                                   value="{{ email }}" placeholder="admin@firm.com" required autofocus>
                        </div>
                    </div>

                    <button class="btn btn-recovery w-100 py-2 shadow-sm">
                        Send OTP <i class="bi bi-shield-lock ms-2"></i>
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="/admin/login" class="back-link">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>

            </div>

            <p class="text-center text-muted mt-5 mb-0" style="font-size: 0.75rem;">
                Authorized access only. Security protocols are active.
            </p>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

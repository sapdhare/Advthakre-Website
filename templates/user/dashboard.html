{% extends 'user/user-layout.html' %}

{% block content %}

<div class="row g-3">

    <div class="col-md-4">

        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <h6 class="text-muted">
                    Pending EVC
                </h6>

                <h2 class="fw-bold text-warning">
                    {{ pending_count }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <h6 class="text-muted">
                    My Verified
                </h6>

                <h2 class="fw-bold text-success">
                    {{ my_verified }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <h6 class="text-muted">
                    Total Verified
                </h6>

                <h2 class="fw-bold text-primary">
                    {{ total_verified }}
                </h2>

            </div>

        </div>

    </div>

</div>

{% endblock %}

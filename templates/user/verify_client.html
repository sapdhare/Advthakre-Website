{% extends 'user/user-layout.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h3 class="fw-bold">
            Verify Client
        </h3>

        <p class="text-muted">
            Upload EVC PDF and submit verification status.
        </p>
    </div>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body">


        <!-- CLIENT DETAILS -->

        <div class="row">


            <div class="col-md-6 mb-3">

                <label class="fw-bold">
                    PAN Number
                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ client.pan_no }}"
                    readonly>

            </div>



            <div class="col-md-6 mb-3">

                <label class="fw-bold">
                    Client Name
                </label>


                <input
                    type="text"
                    class="form-control"
                    value="{{ client.client_name }}"
                    readonly>

            </div>



            <div class="col-md-6 mb-3">

                <label class="fw-bold">
                    Mobile Number
                </label>


                <input
                    type="text"
                    class="form-control"
                    value="{{ client.mobile_no }}"
                    readonly>

            </div>




            <div class="col-md-6 mb-3">

                <label class="fw-bold">
                    Filing Date
                </label>


                <input
                    type="text"
                    class="form-control"
                    value="{{ client.date_of_file }}"
                    readonly>

            </div>


        </div>


        <hr>



        <!-- VERIFY FORM -->


        <form
            action="/user/verify-submit/{{ client.id }}"
            method="POST"
            enctype="multipart/form-data">



            <!-- PDF UPLOAD -->


            <div class="mb-3">


                <label class="form-label fw-bold">

                    Upload EVC PDF

                </label>


                <input
                    type="file"
                    name="evc_pdf"
                    accept=".pdf"
                    required
                    class="form-control">


            </div>





            <!-- REMARK STATUS -->


            <div class="mb-3">


                <label class="form-label fw-bold">

                    Verification Remarks

                </label>



                <select
class="form-select"
name="remark_type"
id="remark_type"
onchange="showOtherRemark()"
required>


<option value="">
Select Remark
</option>


<option value="1">
Verification Done
</option>


<option value="2">
Call Not Received
</option>


<option value="3">
Wrong / Invalid Number
</option>


<option value="4">
Other
</option>


</select>


            </div>






            <!-- OTHER REMARK BOX -->


            <div
                class="mb-3"
                id="otherBox"
                style="display:none;">



                <label class="form-label fw-bold">

                    Enter Other Reason

                </label>



                <textarea
                    name="other_remark"
                    rows="3"
                    class="form-control"
                    placeholder="Enter reason here"></textarea>



            </div>





            <!-- BUTTONS -->


            <button
                type="submit"
                class="btn btn-success">


                <i class="bi bi-check-circle"></i>

                Submit Verification


            </button>




            <a
                href="/user/evc-verification"
                class="btn btn-secondary">


                Back


            </a>




        </form>


    </div>


</div>





<script>


function showOtherRemark(){

let value =
document.getElementById("remark_type").value;


if(value=="4"){

document.getElementById("otherBox").style.display="block";

}
else{

document.getElementById("otherBox").style.display="none";

}

}

</script>


{% endblock %}

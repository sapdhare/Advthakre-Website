events {}

http {

    server {
        listen 80;
        server_name advthakre.com www.advthakre.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name advthakre.com www.advthakre.com;

        ssl_certificate /etc/letsencrypt/live/advthakre.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/advthakre.com/privkey.pem;

        location / {
            proxy_pass http://flaskapp:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
